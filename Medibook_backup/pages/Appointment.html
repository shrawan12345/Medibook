</head>

<body>

<header>

    <nav class="navbar">

        <h1 class="logo">MediBook</h1>

        <ul class="nav-links">

            <li>
                <a href="../Index.html">Home</a>
            </li>

            <li>
                <a href="Doctors.php">Doctors</a>
            </li>

            <li>

            <li>
                <a href="../my_appointment.php">My Appointments</a>
            </li>

            <li>

            </li>

            <li>
                <a href="Contact.html">Contact</a>
            </li>

        </ul>

        <a href="Login.html" class="login-btn">
            Login
        </a>

    </nav>

</header>


<main>

<section class="services">

    <h2>Book an Appointment</h2>

    <p>
        Select a doctor and book your appointment.
    </p>


    <form action="../book_appointment.php" method="POST">

        <!-- Patient Name -->

        <label for="name">
            Patient Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <!-- Email -->

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <!-- Phone -->

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <!-- Doctor -->

        <label for="doctor">
            Select Doctor
        </label>

        <select
            id="doctor"
            name="doctor"
            required
        >

            <option value="">
                Loading doctors...
            </option>

        </select>


        <!-- Appointment Date -->

        <label for="appointment_date">
            Appointment Date
        </label>

        <input
            type="date"
            id="appointment_date"
            name="appointment_date"
            required
        >


        <!-- Appointment Time (10-minute slots) -->

        <label for="appointment_time">
            Appointment Time
        </label>

        <select
            id="appointment_time"
            name="appointment_time"
            required
        >

            <option value="">
                Choose a time
            </option>

        </select>

        <small>
            Each appointment is 10 minutes, from 9:00 AM to 5:00 PM.
        </small>


        <!-- Submit -->

        <button
            type="submit"
            class="book-btn"
        >
            Book Appointment
        </button>

    </form>

</section>

</main>


<footer>

    <p>
        © 2026 MediBook. All Rights Reserved.
    </p>

</footer>


<script>

/* ================================
   PREVENT PAST DATES
================================ */

const dateInput =
    document.getElementById("appointment_date");

const today = new Date();

const year =
    today.getFullYear();

const month =
    String(today.getMonth() + 1).padStart(2, "0");

const day =
    String(today.getDate()).padStart(2, "0");

dateInput.min =
    `${year}-${month}-${day}`;


/* ================================
   BUILD 10-MINUTE TIME SLOTS
================================ */

const timeSelect =
    document.getElementById("appointment_time");

for (let hour = 9; hour <= 17; hour++) {

    for (let minute = 0; minute < 60; minute += 10) {

        if (hour === 17 && minute > 0) {
            break;
        }

        const hh = String(hour).padStart(2, "0");
        const mm = String(minute).padStart(2, "0");

        const hour12 = hour > 12 ? hour - 12 : hour;
        const ampm = hour >= 12 ? "PM" : "AM";

        const option = document.createElement("option");

        option.value = `${hh}:${mm}`;
        option.textContent = `${hour12}:${mm} ${ampm}`;

        timeSelect.appendChild(option);
    }
}


/* ================================
   LOAD DOCTORS
================================ */

const doctorSelect =
    document.getElementById("doctor");


fetch("../get_doctors.php")

    .then(response => {

        if (!response.ok) {
            throw new Error("Could not load doctors.");
        }

        return response.text();

    })

    .then(data => {

        doctorSelect.innerHTML =
            '<option value="">Choose a doctor</option>' +
            data;


        /* ================================
           GET DOCTOR FROM URL
        ================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const selectedDoctor =
            urlParams.get("doctor");


        /* Automatically select doctor */

        if (selectedDoctor) {

            for (let i = 0; i < doctorSelect.options.length; i++) {

                const optionText =
                    doctorSelect.options[i].text;

                const doctorName =
                    optionText.split(" - ")[0].trim();

                if (doctorName === selectedDoctor) {

                    doctorSelect.selectedIndex = i;

                    break;
                }
            }
        }
    })

    .catch(error => {

        console.error(
            "Error loading doctors:",
            error
        );

        doctorSelect.innerHTML =
            '<option value="">Unable to load doctors</option>';

    });

</script>

</body>

</html>
