<main>

<section class="services">

    <h2>Book an Appointment</h2>

    <p>
        Select a doctor and book your appointment.
    </p>


    <form action="../book_appointment.php" method="POST">

        <!-- Patient Name -->

        <label for="name">
            Patient Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <!-- Email -->

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <!-- Phone -->

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <!-- Doctor -->

        <label for="doctor">
            Select Doctor
        </label>

        <select
            id="doctor"
            name="doctor"
            required
        >

            <option value="">
                Loading doctors...
            </option>

        </select>


        <!-- Appointment Date -->

        <label for="appointment_date">
            Appointment Date
        </label>

        <input
            type="date"
            id="appointment_date"
            name="appointment_date"
            required
        >


        <!-- Appointment Time -->

        <label for="appointment_time">
            Appointment Time
        </label>

        <input
            type="time"
            id="appointment_time"
            name="appointment_time"
            min="09:00"
            max="17:00"
            required
        >


        <!-- Submit -->

        <button
            type="submit"
            class="book-btn"
        >
            Book Appointment
        </button>

    </form>

</section>

</main>


<footer>

    <p>
        © 2026 MediBook. All Rights Reserved.
    </p>

</footer>


<script>

/* ================================
   PREVENT PAST DATES
================================ */

const dateInput =
    document.getElementById("appointment_date");

const today = new Date();

const year =
    today.getFullYear();

const month =
    String(today.getMonth() + 1).padStart(2, "0");

const day =
    String(today.getDate()).padStart(2, "0");

dateInput.min =
    `${year}-${month}-${day}`;


/* ================================
   LOAD DOCTORS
================================ */

const doctorSelect =
    document.getElementById("doctor");


fetch("../get_doctors.php")

    .then(response => {

        if (!response.ok) {
            throw new Error("Could not load doctors.");
        }

        return response.text();

    })

    .then(data => {

        doctorSelect.innerHTML =
            '<option value="">Choose a doctor</option>' +
            data;


        /* ================================
           GET DOCTOR FROM URL
        ================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const selectedDoctor =
            urlParams.get("doctor");


        

        /* Automatically select doctor */

if (selectedDoctor) {

    for (let i = 0; i < doctorSelect.options.length; i++) {

        const optionText =
            doctorSelect.options[i].text;

        const doctorName =
            optionText.split(" - ")[0].trim();

        if (doctorName === selectedDoctor) {

            doctorSelect.selectedIndex = i;

            break;
        }
    }
}
    })

    .catch(error => {

        console.error(
            "Error loading doctors:",
            error
        );

        doctorSelect.innerHTML =
            '<option value="">Unable to load doctors</option>';

    });

</script>

</body>
